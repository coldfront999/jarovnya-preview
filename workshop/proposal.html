<!doctype html>
<html lang="ru" data-theme="light" data-material="craft" data-type="oswald">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4d2130">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Жаровня — образец доработки</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="contrast.css"><link rel="stylesheet" href="order-options.css"><link rel="stylesheet" href="menu.css?v=card-interactions"><link rel="stylesheet" href="icons.css?v=menu-pairs"><link rel="stylesheet" href="proposal.css">
</head>
<body data-role="customer">
<div class="menu-studio">
  <aside class="menu-settings proposal-controls" aria-label="Образцы доработки">
    <a class="studio-back" href="menu.html?v=card-interactions&cartMotion=flight">Текущая версия</a>
    <h1>Больше места еде</h1>
    <p>Предложение, собранное из настоящего кода приложения. Фотографии и цены сохранены. Данные примеров хранятся отдельно.</p>
    <nav class="proposal-views" aria-label="Экран образца">
      <button type="button" data-proposal-view="menu" aria-pressed="true">Меню</button>
      <button type="button" data-proposal-view="product" aria-pressed="false">Весовое блюдо</button>
      <button type="button" data-proposal-view="cart" aria-pressed="false">Корзина</button>
      <button type="button" data-proposal-view="admin" aria-pressed="false">Планшет администратора</button>
    </nav>
    <details class="appearance-settings"><summary>Фон и тема</summary>
      <label for="menu-material-select">Фон<select id="menu-material-select"><option value="craft">Крафт</option><option value="urban">Уголь</option></select></label>
      <label for="menu-theme-select">Тема<select id="menu-theme-select"><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label>
      <label for="menu-font-select">Шрифт<select id="menu-font-select"><option value="oswald">Oswald</option><option value="neucha">Neucha</option></select></label>
      <label for="menu-cart-motion-select">Анимация<select id="menu-cart-motion-select"><option value="auto">По настройке устройства</option><option value="flight">Перелёт в корзину</option><option value="quiet">Без перелёта</option></select></label>
    </details>
    <a id="proposal-fullscreen" class="studio-back" href="proposal.html?view=menu&capture=1">Посмотреть без панели</a>
    <p>Это образец для обсуждения. Основное меню и три старых интерфейса не изменены.</p>
  </aside>
  <div class="app-stage"><div id="preview"></div><main id="app"></main></div>
</div>
<div id="modal"></div><div id="toast" role="status" aria-live="polite"></div>
<script src="../vendor/purify.min.js"></script><script src="catalog.js"></script><script src="rules.js"></script><script src="proposal-storage.js"></script><script src="icons.js?v=menu-pairs"></script><script src="app.js?v=compact-cart"></script><script src="menu.js?v=card-interactions"></script><script src="proposal.js"></script>
